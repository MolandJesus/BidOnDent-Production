<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <title>BidOnDent — Compare Auto Body Repair Bids</title>
    <meta
      name="description"
      content="Submit vehicle damage photos, receive competitive bids from local auto body shops, and navigate to the best repair option. BidOnDent makes collision repair simple."
    />
    <meta property="og:title" content="BidOnDent — Compare Auto Body Repair Bids" />
    <meta
      property="og:description"
      content="Submit vehicle damage photos, receive competitive bids from local auto body shops, and navigate to the best repair option."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bidondent.com" />
    <meta property="og:image" content="https://bidondent.com/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BidOnDent — Compare Auto Body Repair Bids" />
    <meta
      name="twitter:description"
      content="Submit vehicle damage photos, receive competitive bids from local auto body shops, and navigate to the best repair option."
    />
    <meta name="twitter:image" content="https://bidondent.com/og-preview.png" />
    <link rel="canonical" href="https://bidondent.com" />
    <meta name="theme-color" content="#0056b3" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BidOnDent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Security headers via meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      (function () {
        try {
          var key = "bidondent.appearance-mode";
          var saved = localStorage.getItem(key);
          var mode =
            saved === "light" || saved === "map-dark"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "map-dark";
          document.documentElement.setAttribute("data-appearance-mode", mode);
          document.documentElement.style.colorScheme = mode === "light" ? "light" : "dark";
        } catch (_err) {
          document.documentElement.setAttribute("data-appearance-mode", "map-dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Pre-React loading indicator — visible until React mounts.
           Connected to data-appearance-mode set by the inline script in <head>,
           so light/dark mode is honored on initial load and reload. -->
      <style>
        @keyframes bd-spin {
          to {
            transform: rotate(360deg);
          }
        }
        #pre-mount-loader {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #071224;
        }
        #pre-mount-loader .pml-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(59, 130, 246, 0.24);
          border-top-color: #60a5fa;
          border-radius: 50%;
          animation: bd-spin 0.8s linear infinite;
          margin: 0 auto 12px;
        }
        #pre-mount-loader .pml-label {
          color: rgba(191, 219, 254, 0.84);
          font-family: system-ui, sans-serif;
          font-size: 14px;
          margin: 0;
        }
        #pre-mount-loader .pml-recovery-text {
          color: rgba(191, 219, 254, 0.55);
          font-family: system-ui, sans-serif;
          font-size: 13px;
        }
        #pre-mount-loader .pml-recovery-link {
          color: #2563eb;
          font-family: system-ui, sans-serif;
          font-size: 13px;
          text-decoration: underline;
        }

        /* Light mode — warm ivory glass on soft blue, gold spinner.
           Mirrors the app's light theme so reload doesn't flash dark. */
        [data-appearance-mode="light"] #pre-mount-loader {
          background:
            radial-gradient(
              ellipse 80% 60% at 50% 0%,
              rgba(255, 248, 235, 0.55),
              transparent 70%
            ),
            linear-gradient(180deg, #eaf2ff 0%, #dce8fb 60%, #cfdef7 100%);
        }
        [data-appearance-mode="light"] #pre-mount-loader .pml-spinner {
          border-color: rgba(212, 175, 55, 0.22);
          border-top-color: #d4af37;
          box-shadow:
            0 0 18px rgba(212, 175, 55, 0.28),
            0 0 6px rgba(212, 175, 55, 0.18);
        }
        [data-appearance-mode="light"] #pre-mount-loader .pml-label {
          color: #1e293b;
        }
        [data-appearance-mode="light"] #pre-mount-loader .pml-recovery-text {
          color: rgba(30, 41, 59, 0.6);
        }
        [data-appearance-mode="light"] #pre-mount-loader .pml-recovery-link {
          color: #1e40af;
        }
      </style>
      <div id="pre-mount-loader">
        <div style="text-align: center">
          <div class="pml-spinner"></div>
          <p class="pml-label">Loading BidOnDent...</p>
          <div id="pre-mount-recovery" style="display: none; margin-top: 24px">
            <p class="pml-recovery-text">Taking longer than expected.</p>
            <a href="javascript:void(location.reload())" class="pml-recovery-link"
              >Tap to reload</a
            >
          </div>
        </div>
      </div>
      <script>
        setTimeout(function () {
          var r = document.getElementById("pre-mount-recovery");
          if (r) r.style.display = "block";
        }, 10000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
