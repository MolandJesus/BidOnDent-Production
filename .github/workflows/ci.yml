name: CI

on:
  push:
    branches: [main, BidOnDent-Horizon-Beta]
  pull_request:
    branches: [main, BidOnDent-Horizon-Beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pass 74 (2026-05-07) — KI-153: explicit least-privilege token scope.
# CodeQL flagged the workflow for relying on the default GITHUB_TOKEN which
# carries read+write across all permission categories. CI here only needs to
# read repo contents and pull-request metadata (for the BidOnDent-Horizon-Beta
# branch context); it never writes back, comments, or releases.
permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/BidOnDent-Horizon-Beta'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
